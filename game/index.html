<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clicker Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Clicker Game</h1>

    <div id="counter">0</div>

    <button id="clickBtn">Click Me!</button>

    <div class="shop">
        <h2>Upgrades</h2>

        <button id="upgradeBtn">
            +1 Click Power — Cost: <span id="upgradeCost">10</span>
        </button>

        <button id="autoBtn">
            Auto‑Clicker — Cost: <span id="autoCost">50</span>
        </button>
    </div>

    <!-- IMPORTANT: your JS file is named script.js -->
    <script src="script.js"></script>

</body>
</html>
