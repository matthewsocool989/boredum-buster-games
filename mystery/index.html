<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mystery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Mystery</h1>
    <p class="hint">An interactive action/thriller. Your choices decide what happens.</p>

    <div id="hud">
        <span id="status"></span>
        <span id="timer"></span>
    </div>

    <div id="scene-container">
        <div id="scene-title"></div>
        <div id="scene-text"></div>
        <div id="choices"></div>
    </div>

    <div id="log-container">
        <h2>Log</h2>
        <div id="log"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
