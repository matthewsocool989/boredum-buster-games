<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Boredum Buster</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>

    <h1>Boredum Buster</h1>
    <p class="tagline">A growing collection of simple, fun browser games.</p>

    <div class="games-grid">

        <div class="game-card">
            <h2>Space Shooter</h2>
            <p>Dodge aliens and blast enemies.</p>
            <a href="spaceshooter/" class="btn3d">Play</a>
        </div>

        <div class="game-card">
            <h2>Memory Tiles</h2>
            <p>Flip cards and match pairs.</p>
            <a href="memory/" class="btn3d">Play</a>
        </div>

        <div class="game-card">
            <h2>Flappy Bird</h2>
            <p>Jump through pipes and survive.</p>
            <a href="flappy/" class="btn3d">Play</a>
        </div>

    </div>

</body>
</html>
