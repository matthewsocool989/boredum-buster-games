<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Boredum Buster</title>
    <meta name="description" content="Fun browser games to cure boredom. Play clicker, memory tiles, space shooter, pac-man style game and more!">
    <link rel="stylesheet" href="home.css">
</head>
<body>

    <h1>Boredum Buster</h1>
    <p class="tagline">A growing collection of simple, fun browser games.</p>

    <div class="games-grid">

        <div class="game-card">
            <h2>Clicker Game</h2>
            <p>Tap your way to infinite points.</p>
            <a href="/dev/game/" class="btn3d">Play</a>
        </div>

        <div class="game-card">
            <h2>Space Shooter</h2>
            <p>Dodge aliens and blast enemies.</p>
            <a href="/dev/spaceshooter/" class="btn3d">Play</a>
        </div>

        <div class="game-card">
            <h2>Memory Tiles</h2>
            <p>Flip cards and match pairs.</p>
            <a href="/dev/memory/" class="btn3d">Play</a>
        </div>

        <div class="game-card">
            <h2>Byte‑Man</h2>
            <p>Collect bits, avoid glitches.</p>
            <a href="/dev/pacman/" class="btn3d">Play</a>
        </div>

    </div>

</body>
</html>
