<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clicker Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Clicker Game</h1>

    <div id="counter">0</div>
    <div id="timer">Time Played: 0s</div>

    <button id="clickBtn">Click Me!</button>

    <div class="shop">
        <h2>Upgrades</h2>
        <button id="upgradeBtn">
            Upgrade (+1 per click) — Cost: <span id="upgradeCost">10</span>
        </button>
    </div>

    <!-- Sound Controls -->
    <div id="soundControls">
        <button id="muteBtn">🔊 Sound On</button>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
    </div>

    <!-- Audio files -->
    <audio id="clickSound" src="click.wav" preload="auto"></audio>
    <audio id="upgradeSound" src="upgrade.wav" preload="auto"></audio>

    <script src="game.js"></script>
</body>
</html>
