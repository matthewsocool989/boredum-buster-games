<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Matthew's Clicker Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Matthew's Clicker Game</h1>

    <div id="counter">0</div>
    <div id="timer">Time Played: 0s</div>

    <button id="clickBtn">Click Me!</button>

    <div class="shop">
        <h2>Upgrades</h2>
        <button id="upgradeBtn">
            Upgrade (+1 per click) — Cost: <span id="upgradeCost">10</span>
        </button>
    </div>

    <!-- Audio files (WAV or MP3 both work) -->
    <audio id="clickSound" src="click.wav" preload="auto"></audio>
    <audio id="upgradeSound" src="upgrade.wav" preload="auto"></audio>

    <script src="game.js"></script>
</body>
</html>
