<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BlockFall</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">
        <h1>BlockFall</h1>

        <canvas id="game" width="240" height="480"></canvas>

        <div id="scoreBox">
            <span id="scoreLabel">Score: 0</span>
        </div>

        <p class="controls">
            Controls: A = Left, D = Right, W = Rotate, S = Soft Drop, Space = Hard Drop
        </p>

        <button id="restartBtn">Restart</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
